{% extends "layout.html" %}
{% from "components/fieldset.html" import fieldset %}

{% block content %}
  {% call fieldset("cat ~" + post.href) %}
    <article>
      <h2 class="m-0 mb-1 text-4xl">{{ post.title }}</h2>
      <h3 class="italic text-xl m-0 font-normal">{{ post.summary }}</h3>
      <div class="h-4" />
    </article>
    {% if post.coverImage %}
      <img src="{{ post.coverImage }}" class="mb-4" />
    {% endif %}
    <article>
      {{ post.content|safe }}
    </article>
  {% endcall %}
{% endblock %}
